name: Keep database awake

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Query the database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run a read query
        env:
          DATABASE_URL: ${{ secrets.KEEP_ALIVE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the KEEP_ALIVE_DATABASE_URL secret to the Supabase session pooler URL."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'select count(*) from components'
